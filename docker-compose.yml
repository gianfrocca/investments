version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: investment_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - investment_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: investment_backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - investment_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: investment_frontend
    restart: always
    networks:
      - investment_network

  nginx:
    build: ./nginx
    container_name: investment_nginx
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - investment_network

  # Backup service
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: investment_backup
    env_file:
      - .env
    volumes:
      - ./backups:/backups
    networks:
      - investment_network
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  investment_network:
    driver: bridge
