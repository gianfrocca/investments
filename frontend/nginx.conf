server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Handle POST requests (often used for health checks) by serving the page with 200 OK
    error_page 405 =200 $uri;

    location / {
        try_files $uri $uri/ /index.html;
        # Disable caching for index.html to ensure updates are seen immediately
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets aggressively as they have content hashes
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
